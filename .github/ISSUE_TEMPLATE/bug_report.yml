name: Bug report
description: Something in Spooler doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check the [open issues](https://github.com/bloodf/spooler/issues) first.
        Remove printer access codes, serial numbers and tokens from anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Spooler version
      description: Shown on Spooler's Settings page.
      placeholder: "0.11.0"
    validations:
      required: true
  - type: input
    id: orca
    attributes:
      label: OrcaSlicer version
      placeholder: "2.5.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows x86_64
        - Windows arm64
        - Linux x86_64
        - Linux arm64
        - macOS arm64 (Apple silicon)
        - macOS x86_64 (Intel)
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Spool source
      options:
        - Spoolman
        - Bambu Cloud
  - type: input
    id: spoolman
    attributes:
      label: Spoolman version
      placeholder: "shown on Spooler's Settings page"
  - type: input
    id: printer
    attributes:
      label: Printer
      description: Model and firmware, and any filament changer (AMS, AFC, Happy Hare...).
      placeholder: "Snapmaker U1, stock firmware 1.0.0"
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: The end of spooler.log. Its path is at the bottom of Spooler's Settings page.
      render: text
