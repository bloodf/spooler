name: Publish to Orca Cloud

# Publishing a GitHub release publishes that version to Orca Cloud.
#
# The usual flow: push a tag like v0.9.2 (release.yml tests, builds every OS and
# opens a DRAFT release), review the draft, click "Publish release" - which runs
# this workflow.
#
# No secrets are needed: the repository is connected to the plugin on Orca Cloud
# (Edit plugin > GitHub publishing) and this run proves where it comes from with a
# short-lived OIDC token signed by GitHub. Orca Cloud only accepts tokens from runs
# triggered by a published release, so this does not run on a tag push.

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      WORKERS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - name: Rebuild and verify the embedded Vue page
        working-directory: ui
        run: npm ci --ignore-scripts && npm run build
      - name: Committed page matches the build
        run: git diff --exit-code -- plugin/spooler/spooler_any.py ui/build.json

      - name: Check the tag matches the plugin version
        run: python scripts/check_version.py "$TAG"

      - name: Unit tests
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: python -m unittest discover -s tests

      - name: Build the plugin for every OS
        run: python scripts/build.py

      - name: Changelog section for this version
        run: |
          awk -v v="${TAG#v}" '
            /^## \[/ { if (found) exit; found = index($0, "[" v "]") > 0; next }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v}"
            exit 1
          fi

      - name: Publish to Orca Cloud
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          metadata="$(jq -cn --arg version "${TAG#v}" --rawfile changelog notes.md \
            '{version: $version, changelog: ($changelog | .[0:4000])}')"
          args=(--form-string "metadata=$metadata")
          for file in dist/*.py; do
            args+=(-F "files=@$file")
          done
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            "${args[@]}" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json
          echo
          if [ "$status" != "201" ]; then
            echo "::error::Orca Cloud returned HTTP $status (401: repository not connected to the plugin; version error: tag not higher than the current plugin version)"
            exit 1
          fi
          echo "Published $TAG to Orca Cloud." >> "$GITHUB_STEP_SUMMARY"
